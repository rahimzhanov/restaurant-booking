{% extends 'base.html' %}

{% block title %}Главная | Ресторан "Вкус"{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1>🍽️ Добро пожаловать в ресторан "Вкус"</h1>
    <p class="lead mt-3">Забронируйте столик онлайн в любое время</p>
    {% if user.is_authenticated %}
        <a href="#" class="btn btn-primary btn-lg mt-3">Посмотреть столики</a>
    {% else %}
        <a href="{% url 'users:register' %}" class="btn btn-primary btn-lg mt-3">Зарегистрироваться</a>
    {% endif %}
</div>
{% endblock %}

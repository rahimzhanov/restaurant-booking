{% extends 'base.html' %}

{% block title %}Редактирование столика | Ресторан "Вкус"{% endblock %}

{% block content %}
<h2>✏️ Редактирование столика №{{ table.number }}</h2>

<div class="row mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Номер столика</label>
                        <input type="number" name="number" class="form-control"
                               value="{{ table.number }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Количество мест</label>
                        <input type="number" name="seats" class="form-control"
                               value="{{ table.seats }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Расположение</label>
                        <input type="text" name="location" class="form-control"
                               value="{{ table.location|default:'' }}"
                               placeholder="У окна, в центре, VIP-зона">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        <textarea name="description" class="form-control" rows="3">{{ table.description|default:'' }}</textarea>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" class="form-check-input"
                               id="isActive" {% if table.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="isActive">Столик активен</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="{% url 'tables:admin_table_list' %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

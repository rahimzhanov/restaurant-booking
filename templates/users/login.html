{% extends 'base.html' %}

{% block title %}Вход | Ресторан "Вкус"{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="text-center mb-4">🔑 Вход в систему</h2>

        <div class="card shadow">
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <!-- Общие ошибки формы (неверный email/пароль) -->
                    {% if form.non_field_errors %}
                    <div class="alert alert-danger">
                        {{ form.non_field_errors }}
                    </div>
                    {% endif %}

                    <!-- Поле Email (username) -->
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Email</label>
                        {{ form.username }}
                    </div>

                    <!-- Поле Пароль -->
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                        {{ form.password }}
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
            </div>
        </div>

        <p class="text-center mt-3">
            Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
